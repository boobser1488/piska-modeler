# Сборка и тесты Piska Modeler на Windows и Linux.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Linux packages (winit, wgpu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libvulkan-dev
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace --all-targets --locked
      - name: Test
        # Тесты видеокарты пропускаются сами, если адаптера нет.
        run: cargo test --workspace --locked
      - name: Clippy
        # engine-i18n — копия крейта движка: его замечания правятся в движке.
        run: cargo clippy --workspace --exclude engine-i18n --all-targets --locked -- -D warnings
      - name: Release build
        run: cargo build --release -p piska-modeler --locked
