[package]
name = "engine-build"
description = "Помощник build.rs: значок приложения в exe на Windows (ресурс RT_GROUP_ICON без rc.exe)."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
image.workspace = true
thiserror.workspace = true

# Запуск программ с окном без консоли: подключение к консоли терминала, окно паники;
# системные окна «Открыть» / «Сохранить» / «Папка» (file_dialog.rs).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Console", "Win32_UI_Controls", "Win32_UI_Controls_Dialogs", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }
